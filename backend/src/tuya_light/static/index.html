<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Tuya Light</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f2137">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuya Light">
<!-- The page draws under the status bar itself; the heading band (navy in both
     themes, as the widget's) sits behind the clock. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<main class="app" id="app" data-conn="loading" data-power="off" data-mode="white">

  <!-- The widget's heading: the light's name, a busy mark, the switch. -->
  <header class="head">
    <h1 class="name" id="name">Tuya Light</h1>
    <label class="picker" id="device-wrap" hidden>
      <span class="visually-hidden" data-t="light">Light</span>
      <select id="device"></select>
    </label>
    <span class="via" id="via" hidden>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 12.5h7.2a2.8 2.8 0 0 0 .4-5.6 3.9 3.9 0 0 0-7.4-1A3.3 3.3 0 0 0 4.5 12.5z"/></svg>
      <span data-t="viaCloud">Tuya cloud</span>
    </span>
    <span class="busy" id="busy" aria-hidden="true"></span>
    <button class="switch" id="power" type="button" role="switch" aria-checked="false"
            data-t-label="power" aria-label="Light" disabled>
      <span class="switch-knob"></span>
    </button>
  </header>

  <section class="body">
    <!-- Setup, pairing or an unreachable light: one message, as in the widget. -->
    <div class="placeholder" id="notice" role="status" aria-live="polite" hidden>
      <svg class="placeholder-icon" id="notice-icon" viewBox="0 0 48 48" aria-hidden="true"></svg>
      <h2 class="placeholder-title" id="notice-title"></h2>
      <p class="placeholder-text" id="notice-text"></p>
      <p class="placeholder-detail" id="notice-detail"></p>
      <button class="button" id="retry" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
        <span data-t="tryAgain">Try again</span>
      </button>
    </div>

    <div class="controls" id="controls">
      <div class="wheel-area">
        <div class="wheel" id="wheel" role="slider" tabindex="0" data-t-label="colour" aria-label="Colour"
             aria-valuemin="0" aria-valuemax="360" aria-valuenow="0">
          <span class="wheel-knob" id="wheel-knob"></span>
        </div>
      </div>

      <div class="bottom">
        <div class="row">
          <svg class="row-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="2.6"/>
            <path d="M8 1.2v1.8M8 13v1.8M1.2 8H3M13 8h1.8M3.2 3.2l1.3 1.3M11.5 11.5l1.3 1.3M3.2 12.8l1.3-1.3M11.5 4.5l1.3-1.3"/>
          </svg>
          <div class="slider" id="bright" role="slider" tabindex="0" data-t-label="brightness"
               aria-label="Brightness" aria-valuemin="1" aria-valuemax="100" aria-valuenow="50">
            <span class="slider-track"><span class="slider-fill"></span></span>
            <span class="slider-handle"></span>
          </div>
          <span class="row-value" id="bright-value" aria-hidden="true"></span>
        </div>

        <div class="row">
          <svg class="row-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path class="drop" d="M8 1.8C6.4 4.4 4.3 6.9 4.3 9.6a3.7 3.7 0 0 0 7.4 0C11.7 6.9 9.6 4.4 8 1.8z"/>
          </svg>
          <div class="slider slider-temp" id="temp" role="slider" tabindex="0" data-t-label="white"
               aria-label="White temperature" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
            <span class="slider-track"></span>
            <span class="slider-handle"></span>
          </div>
          <span class="row-value" id="temp-value" aria-hidden="true"></span>
        </div>

        <div class="favourites" id="favourites" role="group" data-t-label="favourites"
             aria-label="Favourite colours" hidden></div>

        <div class="scenes" id="scenes" role="group" data-t-label="scenes" aria-label="Scenes"></div>
      </div>
    </div>

    <p class="hint" id="hint" hidden>
      <span data-t="addHint">To keep this on your Home Screen, tap Share, then Add to Home Screen.</span>
      <button class="hint-close" id="hint-close" type="button" data-t-label="dismiss" aria-label="Close">×</button>
    </p>
  </section>
</main>
</body>
</html>
